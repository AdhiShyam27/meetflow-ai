<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MeetFlow AI</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 300px;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #0F172A;
      color: #E2E8F0;
      min-height: 360px;
      display: flex;
      flex-direction: column;
    }

    /* Header */
    .header {
      padding: 14px 16px;
      background: rgba(79,70,229,0.15);
      border-bottom: 1px solid rgba(255,255,255,0.08);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .logo-icon {
      width: 28px;
      height: 28px;
      background: linear-gradient(135deg, #4F46E5, #14B8A6);
      border-radius: 7px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .logo-text { font-size: 13px; font-weight: 700; }
    .logo-text .brand { color: #A5B4FC; }
    .logo-text .flow { color: #CBD5E1; }
    .logo-text .ai { color: #5EEAD4; font-size: 11px; }

    .version {
      margin-left: auto;
      font-size: 10px;
      color: #475569;
      background: rgba(255,255,255,0.05);
      padding: 2px 6px;
      border-radius: 4px;
    }

    /* Platform detection */
    .platform-bar {
      padding: 10px 16px;
      background: rgba(20,184,166,0.08);
      border-bottom: 1px solid rgba(20,184,166,0.15);
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: #5EEAD4;
    }

    .platform-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #14B8A6;
    }

    .platform-bar.inactive {
      background: rgba(100,116,139,0.08);
      color: #64748B;
      border-color: rgba(100,116,139,0.15);
    }

    .platform-bar.inactive .platform-dot { background: #64748B; }

    /* Status section */
    .status-section {
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      flex: 1;
    }

    .status-ring {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: rgba(79,70,229,0.1);
      border: 2px solid rgba(79,70,229,0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      transition: all 0.3s ease;
    }

    .status-ring.recording {
      background: rgba(239,68,68,0.1);
      border-color: rgba(239,68,68,0.5);
      animation: pulse-ring 1.5s ease infinite;
    }

    @keyframes pulse-ring {
      0%, 100% { box-shadow: 0 0 0 0 rgba(239,68,68,0.3); }
      50% { box-shadow: 0 0 0 12px rgba(239,68,68,0); }
    }

    .status-label {
      font-size: 12px;
      font-weight: 600;
      color: #94A3B8;
      text-align: center;
    }

    .timer {
      font-size: 28px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      color: white;
      display: none;
    }

    .timer.visible { display: block; }

    /* Main CTA */
    .cta-section {
      padding: 0 16px 16px;
    }

    .btn-start {
      width: 100%;
      padding: 11px 16px;
      background: linear-gradient(135deg, #4F46E5, #6366F1);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s;
      box-shadow: 0 4px 16px rgba(79,70,229,0.3);
    }
    .btn-start:hover { opacity: 0.9; transform: translateY(-1px); }
    .btn-start:active { transform: translateY(0); }

    .btn-stop {
      width: 100%;
      padding: 11px 16px;
      background: linear-gradient(135deg, #EF4444, #DC2626);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s;
    }
    .btn-stop.visible { display: flex; }

    /* Quick links */
    .links {
      padding: 12px 16px;
      border-top: 1px solid rgba(255,255,255,0.06);
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }

    .link-btn {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      color: #94A3B8;
      font-size: 11px;
      padding: 8px 10px;
      border-radius: 9px;
      cursor: pointer;
      text-align: center;
      transition: all 0.15s;
      text-decoration: none;
      display: block;
    }
    .link-btn:hover { background: rgba(255,255,255,0.08); color: #CBD5E1; }

    /* Auth state */
    .auth-section {
      padding: 20px 16px;
      text-align: center;
    }

    .auth-section p {
      font-size: 12px;
      color: #64748B;
      margin-bottom: 12px;
    }

    .btn-signin {
      width: 100%;
      padding: 10px;
      background: #F59E0B;
      color: #0F172A;
      border: none;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <!-- Header -->
  <div class="header">
    <div class="logo-icon">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5">
        <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
      </svg>
    </div>
    <div class="logo-text">
      <span class="brand">Meet</span><span class="flow">Flow</span> <span class="ai">AI</span>
    </div>
    <span class="version" id="ext-version">v1.0</span>
  </div>

  <!-- Platform detection -->
  <div class="platform-bar inactive" id="platform-bar">
    <div class="platform-dot"></div>
    <span id="platform-text">Open Google Meet, Zoom, or Teams to start</span>
  </div>

  <!-- Status -->
  <div class="status-section">
    <div class="status-ring" id="status-ring">🎙️</div>
    <p class="status-label" id="status-label">Ready to transcribe</p>
    <div class="timer" id="timer">00:00</div>
  </div>

  <!-- CTA -->
  <div class="cta-section">
    <button class="btn-start" id="btn-start">
      🎙️ Start Transcription
    </button>
    <button class="btn-stop" id="btn-stop">
      ⬛ Stop & Summarize
    </button>
  </div>

  <!-- Quick links -->
  <div class="links">
    <a class="link-btn" id="open-dashboard" href="#">📊 Dashboard</a>
    <a class="link-btn" id="open-new" href="#">+ New Meeting</a>
    <a class="link-btn" id="open-settings" href="#">⚙️ Settings</a>
    <a class="link-btn" id="open-help" href="#">❓ Help</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
